[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "skelo-linux"
version = "1.1.0"
description = "Deterministic desktop automation for AI agents on Linux without screenshots or vision models."
readme = "README.md"
authors = [
  { name = "shrikirti", email = "author@example.com" }
]
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
  "pyautogui",
]

[project.scripts]
skelo = "skelo.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["skelo*"]
